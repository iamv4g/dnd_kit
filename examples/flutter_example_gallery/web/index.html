<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hosted dnd_kit Flutter example gallery.">
  <!-- Matches the gallery's own ground (and the website's), so the browser
       chrome and the first paint do not flash a different colour. -->
  <meta name="theme-color" content="#FBFAF7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="dnd_kit Examples">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: the dnd_kit mark, generated from website/web/favicon.svg by the
       repo-level tool/icons.sh. Do not hand-edit the PNGs. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dnd_kit Examples</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
