name: Deploy Website

# Run when changes land on main (a merged PR produces a push to main), plus a
# manual trigger. Deploying from main is required because the github-pages
# environment only allows deployments from the default branch — a PR-context
# run (refs/pull/*/merge) is blocked by environment protection rules.
#
# Only paths that feed the published site trigger a redeploy: the site itself,
# the packages it depends on, the embedded Flutter gallery, and the workspace
# resolution and SDK pin. Anything else can still redeploy by hand.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - packages/**
      - examples/flutter_example_gallery/**
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Build Tailwind CSS
        working-directory: website
        run: tool/styles.sh --minify

      # The CLI is a dev dependency, so it and the build_runner that starts the
      # build daemon resolve to one build_daemon through pubspec.lock. A
      # globally activated CLI resolves its own, unpinned, and the daemon
      # handshake breaks whenever pub publishes a newer one. Run under the
      # Flutter-pinned Dart so the daemon snapshots match the SDK (a mismatched
      # Dart crashes the daemon with "Invalid kernel binary format").
      - name: Build website
        working-directory: website
        run: dart run jaspr_cli:jaspr build --verbose

      - name: Verify build output
        working-directory: website/build/jaspr
        run: |
          set -e
          ls -la
          test -f index.html || { echo "ERROR: index.html not found"; exit 1; }
          test -f docs/index.html || { echo "ERROR: docs page not found"; exit 1; }
          test -f showcase/index.html || { echo "ERROR: showcase page not found"; exit 1; }
          test -f main.client.dart.js || { echo "ERROR: client bundle not found"; exit 1; }
          test -f og-image.png || { echo "ERROR: share image not found"; exit 1; }
          # The site is served from the root of its custom domain, which is the
          # <base href="/"/> Document emits; relative asset and cross-page URLs
          # resolve against it.
          grep -q '<base href="/"/>' index.html || { echo "ERROR: base href must target the custom-domain root"; exit 1; }
          grep -q '<base href="/"/>' docs/index.html || { echo "ERROR: base href must target the custom-domain root"; exit 1; }
          grep -q '<meta property="og:image" content="https://dnd-kit.v4g.space/og-image.png"' index.html || { echo "ERROR: og:image must be an absolute URL"; exit 1; }
          grep -q '<meta property="og:url" content="https://dnd-kit.v4g.space/docs/install/"' docs/install/index.html || { echo "ERROR: og:url must name the page being shared"; exit 1; }
          echo "Build output OK"

      - name: Disable Jekyll processing
        run: touch website/build/jaspr/.nojekyll

      # The showcase page embeds the Flutter example gallery in an iframe. Build
      # it for the web under the site root and bundle it into the artifact at
      # flutter/, so the iframe's relative `flutter/` src resolves against the
      # site base href.
      - name: Build Flutter example gallery for web
        working-directory: examples/flutter_example_gallery
        run: flutter build web --release --base-href /flutter/

      - name: Bundle the Flutter gallery into the Pages output
        run: |
          set -e
          mkdir -p website/build/jaspr/flutter
          # rsync (not cp -r): the Flutter web output contains a self-referential
          # `dnd_kit.flutter -> .` symlink that makes `cp -r` choke on a cycle.
          rsync -a --exclude='dnd_kit.flutter' \
            examples/flutter_example_gallery/build/web/ website/build/jaspr/flutter/
          test -f website/build/jaspr/flutter/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/jaspr

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
